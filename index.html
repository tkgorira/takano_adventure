<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>たかの冒険</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0f;
  color: #e8e0d0;
  font-family: 'Hiragino Kaku Gothic ProN', 'メイリオ', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

#bg-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0; pointer-events: none;
}

#app {
  position: relative; z-index: 1;
  width: 100%; max-width: 640px;
  min-height: 100vh;
  display: flex; flex-direction: column;
}

/* ===== タイトル ===== */
#title-screen {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px 20px; text-align: center;
}
.title-main {
  font-size: 3rem; font-weight: bold;
  letter-spacing: 0.3em; color: #f0c060;
  text-shadow: 0 0 30px rgba(240,192,96,0.6);
  margin-bottom: 10px;
  animation: titleGlow 3s ease-in-out infinite;
}
.title-sub { font-size: 0.85rem; color: #888; letter-spacing: 0.2em; margin-bottom: 8px; }
.title-desc { font-size: 0.75rem; color: #555; margin-bottom: 50px; line-height: 1.8; }
@keyframes titleGlow {
  0%,100% { text-shadow: 0 0 20px rgba(240,192,96,0.4); }
  50%      { text-shadow: 0 0 50px rgba(240,192,96,0.9); }
}
.title-btn {
  display: block; width: 220px; padding: 14px 0; margin: 8px auto;
  border: 1px solid #f0c060; background: transparent;
  color: #f0c060; font-size: 1rem; letter-spacing: 0.15em;
  cursor: pointer; transition: all 0.3s; font-family: inherit;
}
.title-btn:hover { background: rgba(240,192,96,0.15); box-shadow: 0 0 20px rgba(240,192,96,0.3); }
.title-btn:disabled { border-color: #333; color: #444; cursor: default; }
.title-endings { margin-top: 32px; font-size: 0.7rem; color: #444; }

/* ===== ゲーム画面 ===== */
#game-screen { display: none; flex-direction: column; min-height: 100vh; }

#status-bar {
  padding: 10px 16px;
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid #1a1a1a;
  display: flex; gap: 8px;
  position: sticky; top: 0; z-index: 10;
}
.stat-item { display: flex; flex-direction: column; flex: 1; min-width: 55px; }
.stat-label { font-size: 0.58rem; color: #777; margin-bottom: 3px; letter-spacing: 0.05em; }
.stat-bar-wrap { height: 5px; background: #1a1a1a; border-radius: 3px; overflow: hidden; }
.stat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.stat-num { font-size: 0.6rem; color: #666; text-align: right; margin-top: 2px; }
.stat-yuuki    .stat-bar-fill { background: linear-gradient(90deg,#c03050,#e05070); }
.stat-okane    .stat-bar-fill { background: linear-gradient(90deg,#308040,#50b060); }
.stat-kenkou   .stat-bar-fill { background: linear-gradient(90deg,#305090,#5090d0); }
.stat-jinmyaku .stat-bar-fill { background: linear-gradient(90deg,#703090,#b050d0); }

/* ===== シーンビジュアルエリア ===== */
#scene-visual {
  position: relative; height: 220px;
  overflow: hidden; flex-shrink: 0;
  display: flex; align-items: flex-end;
}
#scene-bg {
  position: absolute; inset: 0;
  transition: background 0.8s ease;
  background: linear-gradient(180deg,#0a0a12,#12121e);
}
#scene-bg::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg,transparent 40%,rgba(0,0,0,0.7) 100%);
}
/* キャラクタースプライト（本物の画像用）*/
#scene-sprite {
  position: absolute; bottom: 0; left: 50%;
  transform: translateX(-50%);
  max-height: 210px; max-width: 280px;
  object-fit: contain;
  display: none; z-index: 2;
  filter: drop-shadow(0 0 20px rgba(0,0,0,0.8));
  transition: opacity 0.3s ease;
}
/* シチュエーションprop画像モード */
#scene-sprite.prop-mode {
  bottom: auto; top: 50%;
  transform: translate(-50%, -50%);
  max-height: 190px; max-width: 270px;
  opacity: 0.88;
  filter: drop-shadow(0 4px 20px rgba(0,0,0,0.7));
}
/* ロケーションラベル */
#scene-location {
  position: relative; z-index: 3;
  width: 100%; padding: 8px 14px;
  display: flex; justify-content: space-between;
  align-items: flex-end;
}
#scene-num-label { font-size: 0.62rem; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; }
#scene-loc-text  { font-size: 0.7rem; color: rgba(255,255,255,0.5); letter-spacing: 0.15em; }

/* ===== ダイアログエリア ===== */
#dialog-area {
  display: flex; align-items: flex-start;
  padding: 14px 16px 8px;
  gap: 0; cursor: pointer;
  flex: 1;
}

/* ポートレイト */
#portrait-wrap {
  display: none; flex-direction: column;
  align-items: center; flex-shrink: 0;
  width: 64px; gap: 4px;
}
#portrait-circle {
  width: 58px; height: 58px; border-radius: 50%;
  overflow: hidden; position: relative;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid rgba(255,255,255,0.15);
  flex-shrink: 0;
  transition: box-shadow 0.4s ease, background 0.4s ease;
}
#portrait-img-real {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: none;
}
#portrait-char-text {
  font-size: 1.3rem; font-weight: bold;
  color: rgba(255,255,255,0.9);
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
  display: flex;
}
#portrait-name-small {
  font-size: 0.55rem; color: rgba(255,255,255,0.45);
  text-align: center; letter-spacing: 0.05em;
  max-width: 60px; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}

/* テキストボックス */
#text-box {
  flex: 1; padding: 0 4px 0 14px;
  font-size: 0.93rem; line-height: 1.95;
  transition: padding-left 0.2s;
}
#speaker-name {
  font-size: 0.75rem; color: #f0c060;
  margin-bottom: 6px; letter-spacing: 0.1em; min-height: 18px;
}
#text-content { color: #d8d0c0; }
#text-cursor {
  display: inline-block; width: 2px; height: 1em;
  background: #f0c060; margin-left: 2px;
  vertical-align: middle; animation: blink 0.8s step-end infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

#tap-hint {
  text-align: right; font-size: 0.65rem; color: #444;
  padding: 4px 20px 8px; animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

#choices-area {
  padding: 10px 16px 24px;
  display: none; flex-direction: column; gap: 9px;
}
.choice-btn {
  padding: 13px 16px;
  background: rgba(255,255,255,0.03);
  border: 1px solid #2a2a2a; color: #d8d0c0;
  font-size: 0.88rem; line-height: 1.5;
  cursor: pointer; transition: all 0.2s;
  text-align: left; font-family: inherit; position: relative;
}
.choice-btn:hover {
  background: rgba(240,192,96,0.08);
  border-color: rgba(240,192,96,0.5);
  padding-left: 26px;
}
.choice-btn:hover::before {
  content: '▶'; position: absolute; left: 10px;
  color: #f0c060; font-size: 0.65rem; top: 50%; transform: translateY(-50%);
}

/* エフェクト */
.effect-popup {
  position: fixed; font-size: 0.82rem; font-weight: bold;
  pointer-events: none; z-index: 200;
  animation: effectFloat 1.5s forwards;
  text-shadow: 0 0 8px currentColor;
}
@keyframes effectFloat {
  0%   { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-70px) scale(0.8); }
}

/* ===== エンディング ===== */
#ending-screen {
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px 24px; text-align: center;
}
.ending-badge {
  font-size: 0.65rem; letter-spacing: 0.4em; color: #666;
  margin-bottom: 20px; border: 1px solid #333;
  padding: 4px 16px; display: inline-block;
}
.ending-title {
  font-size: 1.5rem; font-weight: bold;
  margin-bottom: 10px; line-height: 1.5; white-space: pre-line;
}
.ending-subtitle { font-size: 0.8rem; color: #777; margin-bottom: 28px; }
.ending-divider { width: 60px; height: 1px; background: #333; margin: 0 auto 28px; }
.ending-text {
  font-size: 0.88rem; line-height: 2.1; color: #bbb;
  max-width: 480px; margin: 0 auto 36px; white-space: pre-line;
}
.ending-stats {
  display: flex; gap: 12px; margin-bottom: 40px;
  justify-content: center; flex-wrap: wrap;
}
.ending-stat {
  text-align: center; padding: 10px 14px;
  border: 1px solid #222; min-width: 70px;
}
.ending-stat-label { font-size: 0.62rem; color: #666; margin-bottom: 4px; }
.ending-stat-val   { font-size: 1.4rem; font-weight: bold; color: #f0c060; }
.ending-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.ending-btn {
  padding: 12px 28px; border: 1px solid #444;
  background: transparent; color: #aaa;
  font-size: 0.88rem; letter-spacing: 0.1em;
  cursor: pointer; transition: all 0.25s; font-family: inherit;
}
.ending-btn:hover { border-color: #f0c060; color: #f0c060; }
.ending-btn.primary { border-color: #f0c060; color: #f0c060; }
.ending-btn.primary:hover { background: rgba(240,192,96,0.12); }

/* ===== セーブ / チャプター / スキップ ===== */
#game-action-bar {
  display:flex; justify-content:flex-end; gap:8px;
  padding:2px 16px 10px;
}
#skip-btn {
  padding:5px 15px;
  background:rgba(8,8,18,0.5);border:1px solid rgba(200,185,140,0.3);
  color:#b8a878;font-size:0.7rem;letter-spacing:0.15em;
  cursor:pointer;font-family:inherit;transition:all 0.2s;
}
#skip-btn:hover{border-color:rgba(240,192,96,0.7);color:#f0c060;}
#skip-btn.active{border-color:#f0c060;color:#f0c060;background:rgba(240,192,96,0.12);}
#btn-save-game {
  padding:5px 14px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(200,185,140,0.3);
  color:#a89868;font-size:0.62rem;letter-spacing:0.12em;
  cursor:pointer;font-family:inherit;transition:all 0.2s;
}
#btn-save-game:hover{border-color:rgba(240,192,96,0.6);color:#f0c060;background:rgba(240,192,96,0.08);}
.modal-ov {
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(0,0,0,0.9);padding:16px;
  align-items:center;justify-content:center;
}
.modal-ov.open{display:flex;}
.modal-box {
  background:#0b0b14;border:1px solid #1e1e2e;
  width:100%;max-width:360px;
  max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
}
.modal-head {
  padding:12px 16px;border-bottom:1px solid #16162a;
  display:flex;align-items:center;gap:12px;
}
.modal-head-title{font-size:0.78rem;color:#f0c060;letter-spacing:0.2em;flex:1;}
.modal-x{background:none;border:none;color:#555;font-size:1rem;cursor:pointer;padding:0 4px;line-height:1;}
.modal-x:hover{color:#f0c060;}
.modal-body{padding:12px 14px;overflow-y:auto;flex:1;}
.modal-empty{text-align:center;padding:28px 0;font-size:0.76rem;color:#444;}
.save-slot{
  padding:11px 13px;border:1px solid #16162a;margin-bottom:8px;
  transition:all 0.2s;display:flex;align-items:center;gap:10px;
}
.slot-info{flex:1;min-width:0;}
.slot-name{font-size:0.72rem;color:#888;margin-bottom:3px;}
.slot-detail{font-size:0.63rem;color:#3a3a4a;line-height:1.6;}
.slot-detail.has{color:#666;}
.slot-btns{display:flex;gap:5px;flex-shrink:0;}
.slot-btn{
  padding:4px 9px;background:none;border:1px solid #222230;
  color:#666;font-size:0.6rem;cursor:pointer;font-family:inherit;transition:all 0.2s;
}
.slot-btn:hover{border-color:#f0c060;color:#f0c060;}
.slot-btn:disabled{color:#2a2a3a;border-color:#16162a;cursor:default;}
.slot-btn.del:hover{border-color:#cc4444;color:#cc4444;}
.chapter-item{
  padding:10px 13px;border:1px solid #16162a;margin-bottom:6px;
  cursor:pointer;transition:all 0.2s;display:flex;align-items:flex-start;gap:11px;
}
.chapter-item:hover{border-color:rgba(240,192,96,0.3);background:rgba(240,192,96,0.03);}
.ch-num{font-size:0.6rem;color:#555;padding-top:2px;min-width:42px;}
.ch-body{flex:1;min-width:0;}
.ch-title{font-size:0.8rem;color:#ccc;margin-bottom:3px;}
.ch-stats{font-size:0.6rem;color:#454555;}

/* ===== トロフィー ===== */
#trophy-section{ margin-top:28px; width:100%; max-width:300px; }
.trophy-head{ font-size:0.52rem; color:#303040; letter-spacing:0.4em; text-align:center; margin-bottom:10px; }
#trophy-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.trophy-badge{ border:1px solid #131320; padding:7px 3px 5px; text-align:center; transition:all 0.25s; }
.trophy-badge.locked{ opacity:0.15; }
.trophy-badge.unlocked{ cursor:pointer; border-color:rgba(255,255,255,0.06); }
.trophy-badge.unlocked:hover{ background:rgba(255,255,255,0.04); transform:translateY(-2px); box-shadow:0 4px 14px rgba(0,0,0,0.5); }
.trophy-badge.trophy-new{ animation:trophyPulse 1.8s ease-in-out 4; }
@keyframes trophyPulse{ 0%,100%{opacity:1} 50%{opacity:0.5} }
.t-bar{ height:2px; margin:0 6px 5px; border-radius:1px; background:#1a1a2a; }
.t-kanji{ font-size:1.1rem; margin-bottom:3px; line-height:1; }
.t-name{ font-size:0.4rem; color:#4a4a5a; line-height:1.4; overflow:hidden; }
.trophy-badge.unlocked .t-name{ color:#666; }
#trophy-tip{ min-height:28px; margin-top:8px; text-align:center; font-size:0.62rem; color:#777; padding:0 8px; line-height:1.7; }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="app">

  <div id="title-screen">
    <div class="title-main">たかの冒険</div>
    <div class="title-sub">〜 俺の人生、俺が選ぶ 〜</div>
    <div class="title-desc">
      これは実話をもとにしたフィクションです。<br>
      選択肢があなたの結末を変える。
    </div>
    <button class="title-btn primary" id="btn-new">はじめから</button>
    <button class="title-btn" id="btn-continue">つづきから</button>
    <button class="title-btn" id="btn-chapter">チャプター選択</button>
    <button class="title-btn" id="btn-load">データロード</button>
    <div class="title-endings" id="title-endings-count"></div>
    <div id="trophy-section">
      <div class="trophy-head">T R O P H I E S</div>
      <div id="trophy-grid"></div>
      <div id="trophy-tip"></div>
    </div>
  </div>

  <div id="game-screen">
    <div id="status-bar">
      <div class="stat-item stat-yuuki">
        <div class="stat-label">勇気</div>
        <div class="stat-bar-wrap"><div class="stat-bar-fill" id="bar-yuuki" style="width:50%"></div></div>
        <div class="stat-num" id="num-yuuki">50</div>
      </div>
      <div class="stat-item stat-okane">
        <div class="stat-label">お金</div>
        <div class="stat-bar-wrap"><div class="stat-bar-fill" id="bar-okane" style="width:50%"></div></div>
        <div class="stat-num" id="num-okane">50</div>
      </div>
      <div class="stat-item stat-kenkou">
        <div class="stat-label">健康</div>
        <div class="stat-bar-wrap"><div class="stat-bar-fill" id="bar-kenkou" style="width:50%"></div></div>
        <div class="stat-num" id="num-kenkou">50</div>
      </div>
      <div class="stat-item stat-jinmyaku">
        <div class="stat-label">人脈</div>
        <div class="stat-bar-wrap"><div class="stat-bar-fill" id="bar-jinmyaku" style="width:50%"></div></div>
        <div class="stat-num" id="num-jinmyaku">50</div>
      </div>
    </div>
    <!-- シーンビジュアル -->
    <div id="scene-visual">
      <div id="scene-bg"></div>
      <img id="scene-sprite" src="" alt="">
      <div id="scene-location">
        <span id="scene-num-label">Scene <span id="scene-num">1</span></span>
        <span id="scene-loc-text"></span>
      </div>
    </div>
    <!-- ダイアログ -->
    <div id="dialog-area">
      <div id="portrait-wrap">
        <div id="portrait-circle">
          <img id="portrait-img-real" src="" alt="">
          <span id="portrait-char-text"></span>
        </div>
        <div id="portrait-name-small"></div>
      </div>
      <div id="text-box">
        <div id="speaker-name"></div>
        <div id="text-content"></div>
        <span id="text-cursor"></span>
      </div>
    </div>
    <div id="tap-hint">タップして次へ ▼</div>
    <div id="game-action-bar">
      <button id="btn-save-game">SAVE</button>
      <button id="skip-btn">SKIP ▶▶</button>
    </div>
    <div id="choices-area"></div>
  </div>

  <div id="ending-screen">
    <div class="ending-badge">E N D I N G</div>
    <div class="ending-title" id="ending-title"></div>
    <div class="ending-subtitle" id="ending-subtitle"></div>
    <div class="ending-divider"></div>
    <div class="ending-text" id="ending-text"></div>
    <div class="ending-stats">
      <div class="ending-stat"><div class="ending-stat-label">勇気</div><div class="ending-stat-val" id="es-yuuki"></div></div>
      <div class="ending-stat"><div class="ending-stat-label">お金</div><div class="ending-stat-val" id="es-okane"></div></div>
      <div class="ending-stat"><div class="ending-stat-label">健康</div><div class="ending-stat-val" id="es-kenkou"></div></div>
      <div class="ending-stat"><div class="ending-stat-label">人脈</div><div class="ending-stat-val" id="es-jinmyaku"></div></div>
    </div>
    <div class="ending-btns">
      <button class="ending-btn primary" id="btn-retry">もう一度プレイ</button>
      <button class="ending-btn" id="btn-title">タイトルへ</button>
    </div>
  </div>


  <!-- セーブ/ロードモーダル -->
  <div class="modal-ov" id="modal-save">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-head-title" id="modal-save-title">セーブ</span>
        <button class="modal-x" id="modal-save-x">✕</button>
      </div>
      <div class="modal-body" id="modal-save-body"></div>
    </div>
  </div>

  <!-- チャプター選択モーダル -->
  <div class="modal-ov" id="modal-chapter">
    <div class="modal-box">
      <div class="modal-head">
        <span class="modal-head-title">チャプター選択</span>
        <button class="modal-x" id="modal-chapter-x">✕</button>
      </div>
      <div class="modal-body" id="modal-chapter-body"></div>
    </div>
  </div>

</div>
<script>
// ===== 背景アニメーション =====
(function(){
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){ c.width=innerWidth; c.height=innerHeight; }
  function init(){
    stars=[];
    for(let i=0;i<90;i++) stars.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.3+0.2,a:Math.random(),s:Math.random()*0.004+0.001});
  }
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(s=>{
      s.a+=s.s; if(s.a>1){s.a=0;s.x=Math.random()*c.width;s.y=Math.random()*c.height;}
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,190,160,${s.a*0.5})`; ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize',()=>{resize();init();});
  resize(); init(); draw();
})();

// ===== キャラクタービジュアル =====
const CHAR_STYLES = {
  'しの':   {bg:'linear-gradient(145deg,#5c1530,#c04070)', char:'し', glow:'#e06080', file:'shino'},
  '舞子':   {bg:'linear-gradient(145deg,#3c1060,#9040c0)', char:'舞', glow:'#b060e0', file:'maiko'},
  'マキ':   {bg:'linear-gradient(145deg,#0c3050,#2070a0)', char:'マ', glow:'#40a0c0', file:'maki'},
  'R':      {bg:'linear-gradient(145deg,#500c18,#c02030)', char:'Ｒ', glow:'#e04050', file:'R'},
  'アキ':   {bg:'linear-gradient(145deg,#503808,#a07010)', char:'ア', glow:'#d0a020', file:'aki'},
  'ハム':   {bg:'linear-gradient(145deg,#0c4028,#208050)', char:'ハ', glow:'#40c080', file:'hamu'},
  '明美':   {bg:'linear-gradient(145deg,#104028,#308060)', char:'明', glow:'#60c090', file:'akemi'},

function updateVisuals(sceneId, speaker){
  // 背景グラデーション
  const sc = SCENE_STYLES[sceneId] || SCENE_STYLES.default;
  document.getElementById('scene-bg').style.background = sc.bg;
  document.getElementById('scene-loc-text').textContent = sc.loc || '';
  document.getElementById('scene-num').textContent = (SCENES[sceneId]&&SCENES[sceneId].num)||'?';

  // キャラクタースプライト（本物の画像がある場合）
  const spriteEl = document.getElementById('scene-sprite');
  const isNarrator = !speaker || speaker==='' || speaker.includes('心の声') || speaker.includes('メッセージ') || speaker.includes('返信') || speaker.includes('アプリ') || speaker.includes('ひそひそ');

  // スプライト画像（images/sprites/{key}.png）
  const spriteKey = isNarrator ? null : Object.keys(CHAR_STYLES).find(k=>speaker.startsWith(k)||speaker===k);

  function loadImg(el, src, propMode){
    if(propMode !== undefined){ if(propMode) el.classList.add('prop-mode'); else el.classList.remove('prop-mode'); }
    const show = ()=>{ el.style.display='block'; };
    const hide = ()=>{ el.style.display='none'; };
    el.onload  = show;
    el.onerror = hide;
    if(!src){ hide(); el.src=''; return; }
    if(el.src.endsWith(src.replace(/^.*\//,'')) && el.complete){
      el.naturalWidth > 0 ? show() : hide();
    } else {
      el.src = src;
      if(el.complete){ el.naturalWidth > 0 ? show() : hide(); }
    }
  }

  if(spriteKey){
    loadImg(spriteEl, `images/sprites/${CHAR_STYLES[spriteKey].file||spriteKey}.png`, false);
  } else {
    const propFile = sc.prop;
    if(propFile) loadImg(spriteEl, `images/props/${propFile}`, true);
    // propなしナレーションは前の立ち絵をそのまま維持
  }

  // ポートレイト（小さい円形）
  const pWrap   = document.getElementById('portrait-wrap');
  const pCircle = document.getElementById('portrait-circle');
  const pChar   = document.getElementById('portrait-char-text');
  const pImgR   = document.getElementById('portrait-img-real');
  const pSmall  = document.getElementById('portrait-name-small');

  if(isNarrator){
    // ナレーション中もポートレイトをそのまま維持
  } else {
    pWrap.style.display = 'flex';
    const key = Object.keys(CHAR_STYLES).find(k=>speaker.startsWith(k)||speaker===k);
    if(key){
      const cs = CHAR_STYLES[key];
      pCircle.style.background  = cs.bg;
      pCircle.style.boxShadow   = `0 0 14px ${cs.glow}55, inset 0 0 8px rgba(0,0,0,0.4)`;
      pChar.textContent = cs.char;
      pChar.style.display = 'flex';
      // ポートレイト画像があれば使用
      const pSrc = `images/portraits/${cs.file||key}.png`;
      pImgR.onload  = ()=>{ pImgR.style.display='block'; pChar.style.display='none'; };
      pImgR.onerror = ()=>{ pImgR.style.display='none'; pChar.style.display='flex'; };
      if(pImgR.src.endsWith(pSrc.replace(/^.*\//,'')) && pImgR.complete){
        if(pImgR.naturalWidth > 0){ pImgR.style.display='block'; pChar.style.display='none'; }
        else { pImgR.style.display='none'; pChar.style.display='flex'; }
      } else {
        pImgR.src = pSrc;
        if(pImgR.complete){ pImgR.naturalWidth>0 ? (pImgR.style.display='block',pChar.style.display='none') : (pImgR.style.display='none',pChar.style.display='flex'); }
      }
    } else {
      pCircle.style.background = 'linear-gradient(145deg,#2a2a2a,#444)';
      pCircle.style.boxShadow  = 'none';
      pChar.textContent = speaker[0]||'?';
      pChar.style.display='flex';
      pImgR.src='';
    }
    pSmall.textContent = speaker.replace(/（[^）]*）/g,'').trim();
  }
}

// ===== 突発フラグ管理 =====
function getFlags(){ const r=localStorage.getItem('takano_flags'); return r?JSON.parse(r):{}; }
function setFlag(name){ const f=getFlags(); f[name]=true; localStorage.setItem('takano_flags',JSON.stringify(f)); }
function hasFlag(name){ return !!getFlags()[name]; }

// どのシーンを通過したらフラグを立てるか
const FLAG_TRIGGERS = {
  's1_hamu_close':       'hamu_close',
  's2_shino':            'met_shino',
  's3_support':          'met_shino',
  's6_marry':            'met_maiko',
  's7_affair':           'met_maiko',
  's10_aki_deep':        'met_aki',
  's_bye_maki':          'left_maki',
  's10_maki_s':          'left_maki',
  's_bye_shino_arrest':  'shino_abandoned',
  's_bye_shino_support': 'shino_abandoned',
};

// ステータスが低すぎる場合に強制ルートへ誘導（意図せず選択パターンが積み重なると発動）
const FORCED_ROUTES = [
  // 独身ルート：出会い・結婚シーンで勇気＋人脈が低いと踏み込めない
  { at:'s5_another', cond: s => s.yuuki < 25 && s.jinmyaku < 25, to:'s5_no_love' },
  { at:'s6_marry',   cond: s => s.yuuki < 30,                    to:'s5_solo_time' },
  // 死亡ルート：中盤以降、健康が限界を超えると死へ
  { at:'s11_R',        cond: s => s.kenkou < 20 || s.yuuki < 15, to:'END_death' },
  { at:'s12_control',  cond: s => s.kenkou < 15,                 to:'END_death' },
  // ハムと仲良くなっていない場合はハム登場なし版へ
  { at:'s8_divorce', cond: () => !hasFlag('hamu_close'), to:'s8_divorce_nohamu' },
];

// どのシーンで誰が割り込むか（フラグが立っていれば1回だけ発動）
const INTERRUPTS = {
  's10_maki_intro': {flag:'met_shino',      scene:'int_shino'},
  's11_R':          {flag:'met_maiko',      scene:'int_maiko'},
  's12_control':    {flag:'met_aki',        scene:'int_aki'},
  's14_marry_R':    {flag:'left_maki',      scene:'int_maki'},
  's7_forgive':     {flag:'shino_abandoned',scene:'int_shino_stalker'},
};

function clamp(v){ return Math.max(0,Math.min(100,v)); }

function updateStatUI(){
  ['yuuki','okane','kenkou','jinmyaku'].forEach(k=>{
    const v = stats[k];
    document.getElementById('bar-'+k).style.width = v+'%';
    document.getElementById('num-'+k).textContent = v;
  });
}

function saveGame(){

}
function loadSave(){ const r=localStorage.getItem('takano_save'); return r?JSON.parse(r):null; }

function recordEnding(key){
  const raw = localStorage.getItem('takano_endings')||'{}';
  const obj = JSON.parse(raw);
  obj[key] = true;
  localStorage.setItem('takano_endings', JSON.stringify(obj));
}
function countEndings(){
  const raw = localStorage.getItem('takano_endings')||'{}';
  return Object.keys(JSON.parse(raw)).length;
}

function showEffects(effects, targetEl){
  const labels={yuuki:'勇気',okane:'お金',kenkou:'健康',jinmyaku:'人脈'};
  const colors ={yuuki:'#e05070',okane:'#50b060',kenkou:'#5090d0',jinmyaku:'#b050d0'};
  let delay=0;
  Object.entries(effects).forEach(([k,v])=>{
    if(v===0) return;
    const el = document.createElement('div');
    el.className='effect-popup';
    el.textContent = labels[k]+(v>0?` +${v}`:` ${v}`);
    el.style.color = colors[k];
    const rect = targetEl.getBoundingClientRect();
    el.style.left=(rect.left+Math.random()*rect.width*0.5+rect.width*0.2)+'px';
    el.style.top =(rect.top +Math.random()*40+10)+'px';
    el.style.animationDelay=delay+'ms';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),1600+delay);
    delay+=160;
  });
}

function typeText(text, onDone){
  const el=document.getElementById('text-content');
  const cursor=document.getElementById('text-cursor');
  el.textContent=''; cursor.style.display='inline-block';
  isTyping=true; skipFlag=false;
  let i=0;
  function step(){
    if(skipFlag){ el.textContent=text; isTyping=false; cursor.style.display='none'; onDone&&onDone(); return; }
    if(i<text.length){ el.textContent+=text[i++]; setTimeout(step,35); }
    else{ isTyping=false; cursor.style.display='none'; onDone&&onDone(); }
  }
  step();
}

function handleNext(nx){
  if(!nx) return;
  if(nx.startsWith('END_')){ showEnding(nx); }
  else{ showScene(nx); }
}

function showScene(id){
  // 強制ルートチェック（ステータス不足で特定シーンへ誘導）
  for(const fr of FORCED_ROUTES){
    if(fr.at === id && fr.cond(stats)){
      id = fr.to;
      break;
    }
  }
  if(id.startsWith('END_')){ showEnding(id); return; }

  // フラグ記録
  if(FLAG_TRIGGERS[id]) setFlag(FLAG_TRIGGERS[id]);

  // 突発フラグ割り込みチェック（1プレイで1回だけ）
  const intr = INTERRUPTS[id];
  if(intr && hasFlag(intr.flag) && !hasFlag('int_done_'+id)){
    setFlag('int_done_'+id);
    id = intr.scene;
  }

  currentId = id;
  textIndex = 0;
  awaitAdv  = false;
  recordChapter(id);
  const scene = SCENES[id];
  document.getElementById('choices-area').style.display='none';
  document.getElementById('choices-area').innerHTML='';
  document.getElementById('tap-hint').style.display='block';
  document.getElementById('tap-hint').textContent='タップして次へ ▼';
  showNextText();
}

function showNextText(){
  const scene = SCENES[currentId];
  if(textIndex >= scene.texts.length){
    document.getElementById('tap-hint').style.display='none';
    if(scene.choices && scene.choices.length>0){
      isSkipping = false;
      document.getElementById('skip-btn').classList.remove('active');
      showChoices(scene.choices);
    } else if(scene.nx){
      if(isSkipping){
        handleNext(scene.nx);
      } else {
        document.getElementById('tap-hint').style.display='block';
        document.getElementById('tap-hint').textContent='タップして続ける ▼';
        awaitAdv = true;
      }
    }
    return;
  }
  awaitAdv = false;
  const item = scene.texts[textIndex];
  document.getElementById('speaker-name').textContent = item.sp||'';
  updateVisuals(currentId, item.sp);
  if(isSkipping){
    document.getElementById('text-content').textContent = item.tx;
    document.getElementById('text-cursor').style.display='none';
    isTyping = false; skipFlag = false;
    textIndex++; saveGame();
    skipTimerId = setTimeout(showNextText, 60);
  } else {
    typeText(item.tx, ()=>{
      textIndex++; saveGame();
      if(isSkipping){ skipTimerId = setTimeout(showNextText, 60); }
    });
  }
}

function showChoices(choices){
  const area=document.getElementById('choices-area');
  area.innerHTML=''; area.style.display='flex';
  choices.forEach(c=>{
    const btn=document.createElement('button');
    btn.className='choice-btn'; btn.textContent=c.tx;
    btn.addEventListener('click',()=>{
      area.style.display='none';
      Object.entries(c.ef).forEach(([k,v])=>{ stats[k]=clamp(stats[k]+v); });
      updateStatUI();
      showEffects(c.ef, btn);
      setTimeout(()=>handleNext(c.nx), 300);
    });
    area.appendChild(btn);
  });
}

  isSkipping = false;

  if(!STORY_ENDINGS.has(key)){

    else if(stats.okane < 10 && key !== 'END_broke')  key = 'END_broke';

function getSlot(n){
  const r=localStorage.getItem('takano_slot_'+n);
  return r?JSON.parse(r):null;
}
function saveToSlot(n){
  const scene=SCENES[currentId];
  const dt=new Date();
  const ts=`${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${String(dt.getMinutes()).padStart(2,'0')}`;
  localStorage.setItem('takano_slot_'+n,JSON.stringify({
    stats:{...stats},id:currentId,
    sceneNum:(scene&&scene.num)||'?',
    sceneTitle:(scene&&scene.title)||'',
    ts
  }));
  closeModal('modal-save');
  showToast('スロット'+(n+1)+'にセーブしました');
}
function loadFromSlot(n){
  const d=getSlot(n);if(!d)return;
  stats={...d.stats};currentId=d.id;textIndex=0;
  updateStatUI();
  document.getElementById('title-screen').style.display='none';
  document.getElementById('ending-screen').style.display='none';
  document.getElementById('game-screen').style.display='flex';
  closeModal('modal-save');
  initGameClickListener();
  showScene(currentId);
}
function deleteSlot(n){
  localStorage.removeItem('takano_slot_'+n);
  renderSaveModal(currentSaveMode);
}

// ===== チャプター記録 =====
function recordChapter(id){
  const scene=SCENES[id];
  if(!scene||!scene.title)return;
  const raw=localStorage.getItem('takano_chapters')||'{}';
  const obj=JSON.parse(raw);
  if(!obj[id]){
    obj[id]={title:scene.title,num:scene.num,stats:{...stats}};
    localStorage.setItem('takano_chapters',JSON.stringify(obj));
  }
}
function getChapters(){
  return JSON.parse(localStorage.getItem('takano_chapters')||'{}');
}

// ===== モーダル =====
let currentSaveMode='save';
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModal(id){document.getElementById(id).classList.remove('open');}

function renderSaveModal(mode){
  currentSaveMode=mode;
  document.getElementById('modal-save-title').textContent=mode==='save'?'セーブ':'ロード';
  const body=document.getElementById('modal-save-body');
  body.innerHTML='';
  for(let n=0;n<3;n++){
    const d=getSlot(n);
    const slot=document.createElement('div');slot.className='save-slot';
    const info=document.createElement('div');info.className='slot-info';
    const nm=document.createElement('div');nm.className='slot-name';
    nm.textContent='スロット '+(n+1);
    const det=document.createElement('div');det.className='slot-detail'+(d?' has':'');
    if(d) det.innerHTML=`Scene ${d.sceneNum}：${d.sceneTitle||'—'}<br>${d.ts}`;
    else  det.textContent='（データなし）';
    info.appendChild(nm);info.appendChild(det);
    const btns=document.createElement('div');btns.className='slot-btns';
    if(mode==='save'){
      const sb=document.createElement('button');sb.className='slot-btn';sb.textContent='セーブ';
      sb.addEventListener('click',()=>saveToSlot(n));btns.appendChild(sb);
      if(d){
        const db=document.createElement('button');db.className='slot-btn del';db.textContent='削除';
        db.addEventListener('click',()=>deleteSlot(n));btns.appendChild(db);
      }
    } else {
      const lb=document.createElement('button');lb.className='slot-btn';lb.textContent='ロード';
      if(d) lb.addEventListener('click',()=>loadFromSlot(n));
      else  lb.disabled=true;
      btns.appendChild(lb);
    }
    slot.appendChild(info);slot.appendChild(btns);
    body.appendChild(slot);
  }
}

function renderChapterModal(){
  const body=document.getElementById('modal-chapter-body');
  const chapters=getChapters();
  const keys=Object.keys(chapters);
  if(!keys.length){
    body.innerHTML='<div class="modal-empty">まだ解放されたチャプターがありません</div>';
    return;
  }
  body.innerHTML='';
  keys.sort((a,b)=>(parseInt(chapters[a].num)||99)-(parseInt(chapters[b].num)||99));
  keys.forEach(id=>{
    const ch=chapters[id];
    const item=document.createElement('div');item.className='chapter-item';
    const num=document.createElement('div');num.className='ch-num';num.textContent='Scene '+ch.num;
    const bd=document.createElement('div');bd.className='ch-body';
    const ti=document.createElement('div');ti.className='ch-title';ti.textContent=ch.title;
    const st=document.createElement('div');st.className='ch-stats';
    st.textContent=`勇${ch.stats.yuuki} お${ch.stats.okane} 健${ch.stats.kenkou} 人${ch.stats.jinmyaku}`;
    bd.appendChild(ti);bd.appendChild(st);
    item.appendChild(num);item.appendChild(bd);
    item.addEventListener('click',()=>{
      stats={...ch.stats};updateStatUI();
      document.getElementById('title-screen').style.display='none';
      document.getElementById('ending-screen').style.display='none';
      document.getElementById('game-screen').style.display='flex';
      closeModal('modal-chapter');
      initGameClickListener();
      showScene(id);
    });
    body.appendChild(item);
  });
}

let _clickListenerAdded=false;
function initGameClickListener(){
  if(_clickListenerAdded)return;
  _clickListenerAdded=true;
  document.getElementById('game-screen').addEventListener('click',function(e){
    if(e.target.closest('#choices-area'))return;
    if(e.target.closest('#game-action-bar'))return;
    if(isSkipping){
      isSkipping=false;skipFlag=true;
      if(skipTimerId){clearTimeout(skipTimerId);skipTimerId=null;}
      document.getElementById('skip-btn').classList.remove('active');
      // fall through → 通常のタップ処理へ続行
    }
    if(isTyping){skipFlag=true;return;}
    if(awaitAdv){awaitAdv=false;handleNext(SCENES[currentId].nx);return;}
    if(document.getElementById('choices-area').style.display==='none'){showNextText();}
  },{passive:true});
}

function renderTrophies(){
  const grid = document.getElementById('trophy-grid');
  if(!grid) return;
  const unlocked = JSON.parse(localStorage.getItem('takano_endings')||'{}');
  const newBadges = JSON.parse(localStorage.getItem('takano_new_endings')||'{}');
  grid.innerHTML = '';
  Object.keys(ENDINGS).forEach(key=>{
    const end = ENDINGS[key];
    const isUnlocked = !!unlocked[key];
    const div = document.createElement('div');
    div.className = 'trophy-badge ' + (isUnlocked ? 'unlocked' : 'locked');
    if(isUnlocked && newBadges[key]) div.classList.add('trophy-new');
    const bar = document.createElement('div'); bar.className='t-bar';
    if(isUnlocked) bar.style.background = end.color;
    const kanji = document.createElement('div'); kanji.className='t-kanji';
    kanji.textContent = TROPHY_KANJI[key]||'？';
    if(isUnlocked) kanji.style.color = end.color;
    const name = document.createElement('div'); name.className='t-name';
    name.textContent = isUnlocked ? end.title : '???';
    div.appendChild(bar); div.appendChild(kanji); div.appendChild(name);
    if(isUnlocked){
      div.addEventListener('mouseenter',()=>{
        document.getElementById('trophy-tip').textContent = end.title+'　'+end.subtitle;
      });
      div.addEventListener('mouseleave',()=>{
        document.getElementById('trophy-tip').textContent='';
      });
    }
    grid.appendChild(div);
  });
  localStorage.removeItem('takano_new_endings');
}

// エンディング記録時に新着マーク
const _origRecordEnding = recordEnding;
recordEnding = function(key){
  const raw = localStorage.getItem('takano_endings')||'{}';
  const isNew = !JSON.parse(raw)[key];
  _origRecordEnding(key);
  if(isNew){
    const n = JSON.parse(localStorage.getItem('takano_new_endings')||'{}');
    n[key]=true;
    localStorage.setItem('takano_new_endings',JSON.stringify(n));
  }
};
